name: Release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable GHCR images
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Create isolated Buildx builder
        run: |
          set -euo pipefail
          docker buildx create \
            --driver docker-container \
            --name "wa-savana-${GITHUB_RUN_ID}" \
            --use
          docker buildx inspect --bootstrap

      - name: Authenticate GitHub Actions to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish server and client
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image_root="ghcr.io/bhsh2002"
          server_package="savana-wa-server"
          client_package="savana-wa-client"
          expected_repository="bhsh2002/WhatsAppPlatform"

          metadata_is_private_expected_repository() {
            local package="$1"
            jq -e \
              --arg package "$package" \
              --arg repository "$expected_repository" \
              --argjson repository_id "$GITHUB_REPOSITORY_ID" '
              .name == $package
              and .visibility == "private"
              and ((.repository.full_name // null) == $repository)
              and ((.repository.id // null) == $repository_id)
            ' >/dev/null
          }

          preflight_package() {
            local package="$1"
            local metadata_file="/tmp/${package}-preflight.json"
            local status

            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$metadata_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GHCR_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${package}")"

            case "$status" in
              200)
                metadata_is_private_expected_repository "$package" <"$metadata_file" || {
                  echo "Existing GHCR package ${package} is not private or is linked to an unexpected repository" >&2
                  exit 1
                }
                ;;
              *)
                echo "Unable to preflight GHCR package ${package}: HTTP ${status}" >&2
                exit 1
                ;;
            esac
          }

          preflight_package "$server_package"
          preflight_package "$client_package"

          docker buildx build \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --tag "${image_root}/${server_package}:sha-${RELEASE_SHA}" \
            --metadata-file /tmp/wa-server-metadata.json \
            --push \
            server

          docker buildx build \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --tag "${image_root}/${client_package}:sha-${RELEASE_SHA}" \
            --metadata-file /tmp/wa-client-metadata.json \
            --push \
            client

          server_digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            /tmp/wa-server-metadata.json)"
          client_digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            /tmp/wa-client-metadata.json)"

          verify_private_expected_repository() {
            local package="$1"
            local metadata

            metadata="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GHCR_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${package}")"

            metadata_is_private_expected_repository "$package" <<<"$metadata" || {
              echo "GHCR package ${package} is not private or is linked to an unexpected repository; refusing release" >&2
              exit 1
            }
          }

          verify_private_expected_repository "$server_package"
          verify_private_expected_repository "$client_package"

          server_ref="${image_root}/${server_package}@${server_digest}"
          client_ref="${image_root}/${client_package}@${client_digest}"

          server_revision="$(docker buildx imagetools inspect "$server_ref" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          client_revision="$(docker buildx imagetools inspect "$client_ref" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$server_revision" == "$RELEASE_SHA" ]] \
            || { echo "Server OCI revision does not match the verified commit" >&2; exit 1; }
          [[ "$client_revision" == "$RELEASE_SHA" ]] \
            || { echo "Client OCI revision does not match the verified commit" >&2; exit 1; }

          anonymous_config="$(mktemp -d)"
          for image in "$server_ref" "$client_ref"; do
            anonymous_error=""
            if anonymous_error="$(DOCKER_CONFIG="$anonymous_config" \
              docker manifest inspect "$image" 2>&1)"; then
              echo "Private GHCR image is anonymously readable: $image" >&2
              exit 1
            fi
            if ! grep -Eqi 'denied|unauthorized|authentication required' <<<"$anonymous_error"; then
              echo "Anonymous access failed for an unverified reason: $image" >&2
              exit 1
            fi
          done

          {
            printf '## Wa Savana immutable images\n\n'
            printf '| Component | Pull reference |\n'
            printf '| --- | --- |\n'
            printf '| Server | `%s` |\n' "$server_ref"
            printf '| Client | `%s` |\n' "$client_ref"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm "wa-savana-${GITHUB_RUN_ID}" || true
