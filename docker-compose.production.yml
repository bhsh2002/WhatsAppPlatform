name: wa-savana-production

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  server:
    image: ghcr.io/bhsh2002/wa-savana-server@sha256:${WA_SERVER_IMAGE_DIGEST:?Set the 64-character server image digest}
    pull_policy: always
    container_name: wa-savana-server
    restart: unless-stopped
    init: true
    user: "1000:1000"
    env_file:
      - ${WA_RUNTIME_ENV_FILE:?Set WA_RUNTIME_ENV_FILE to the production runtime env file}
    environment:
      NODE_ENV: production
      PORT: "3031"
      DATABASE_PATH: /app/data/platform.db
      BACKUP_DIR: /app/data/backups
      TZ: Africa/Tripoli
    expose:
      - "3031"
    volumes:
      - type: bind
        source: ${WA_DATA_DIR:?Set WA_DATA_DIR to the persistent data directory}
        target: /app/data
        bind:
          selinux: Z
      - type: bind
        source: ${WA_UPLOADS_DIR:?Set WA_UPLOADS_DIR to the persistent uploads directory}
        target: /app/uploads
        bind:
          selinux: Z
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    mem_reservation: 384m
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 30s
    logging: *json-logging
    labels:
      org.opencontainers.image.revision: ${WA_RELEASE_SHA:?Set WA_RELEASE_SHA to the full Git commit}
      savana.service: wa-savana-server
    networks:
      - internal
      - control-plane
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3031/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  client:
    image: ghcr.io/bhsh2002/wa-savana-client@sha256:${WA_CLIENT_IMAGE_DIGEST:?Set the 64-character client image digest}
    pull_policy: always
    container_name: wa-savana-frontend
    restart: unless-stopped
    init: true
    user: "101:101"
    ports:
      - "127.0.0.1:3133:8080"
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0755,size=32m
      - /var/run:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0755,size=8m
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m
    mem_reservation: 32m
    cpus: 0.5
    stop_grace_period: 15s
    logging: *json-logging
    labels:
      org.opencontainers.image.revision: ${WA_RELEASE_SHA:?Set WA_RELEASE_SHA to the full Git commit}
      savana.service: wa-savana-frontend
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  internal:
    name: wa-savana-production-internal
    driver: bridge
    internal: true
  control-plane:
    name: savana-control-plane-network
    external: true
