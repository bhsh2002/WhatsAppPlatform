services:
  server:
    build: ./server
    container_name: whatsapp-platform-server
    ports:
      - "3001:3001"
    volumes:
      - ./server/db:/app/db
      - ./server/.env:/app/.env
    restart: always

  client:
    build: ./client
    container_name: whatsapp-platform-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always
