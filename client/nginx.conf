# Keep access observability without persisting OAuth codes, one-time SSE/media
# tokens, or any future credentials carried in a query string. Do not include
# $request, $request_uri, $args, or Referer in this format.
log_format safe_access '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_user_agent"';

server {
    listen 8080;
    listen [::]:8080;
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout safe_access;
    # Nginx has no custom error-log format and upstream failures include the
    # full request URI. Caddy keeps the filtered upstream error record and the
    # health checks retain failure visibility without duplicating credentials.
    error_log /dev/null;

    # Keep the browser on one origin and strip the public /api prefix before
    # forwarding to Express, whose routes are mounted at /auth, /portal, etc.
    # Buffering must be disabled because this location also carries SSE.
    location /api/ {
        proxy_pass http://server:3031/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Service workers must never fall through to the SPA document. Revalidate on
    # every load so a newly deployed worker can take control promptly.
    location = /sw.js {
        types { }
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
