name: Release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable GHCR images
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Export exact verified committed build contexts
        id: controlled
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/wa_controlled_release.py export \
            --repository "$GITHUB_WORKSPACE" \
            --revision "$RELEASE_SHA" \
            --output-directory "$RUNNER_TEMP/wa-controlled-context" \
            > "$RUNNER_TEMP/wa-controlled-export.json"
          python3 - <<'PYOUTPUT'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'wa-controlled-export.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('git_revision', 'source_sha256', 'context_manifest_sha256'):
                  output.write(f'{key}={data[key]}\n')
          PYOUTPUT

      - name: Set up pinned isolated image builder
        id: image-builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.38.2
          name: wa-savana-release-${{ github.run_id }}-${{ github.run_attempt }}
          driver: docker-container
          # Keep the normal process sandbox; do not enable insecure entitlements.
          buildkitd-flags: --oci-worker-gc=true
          driver-opts: |
            image=moby/buildkit:v0.34.2
            memory=2g
            memory-swap=2g
            cpu-period=100000
            cpu-quota=200000

      - name: Verify owned builder versions and outer memory and PID bounds
        env:
          BUILDER_NAME: ${{ steps.image-builder.outputs.name }}
          BUILDER_NODES: ${{ steps.image-builder.outputs.nodes }}
        run: |
          python3 -B tools/wa_controlled_release.py verify-builder \
            --builder "$BUILDER_NAME" --nodes "$BUILDER_NODES"

      - name: Authenticate GitHub Actions to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish server and client
        env:
          BUILDX_BUILDER: ${{ steps.image-builder.outputs.name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          CONTROLLED_SOURCE_SHA256: ${{ steps.controlled.outputs.source_sha256 }}
          CONTROLLED_MANIFEST_SHA256: ${{ steps.controlled.outputs.context_manifest_sha256 }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image_root="ghcr.io/bhsh2002"
          server_package="savana-wa-server"
          client_package="savana-wa-client"
          expected_repository="bhsh2002/WhatsAppPlatform"

          metadata_is_private_expected_repository() {
            local package="$1"
            jq -e \
              --arg package "$package" \
              --arg repository "$expected_repository" \
              --argjson repository_id "$GITHUB_REPOSITORY_ID" '
              .name == $package
              and .visibility == "private"
              and ((.repository.full_name // null) == $repository)
              and ((.repository.id // null) == $repository_id)
            ' >/dev/null
          }

          preflight_package() {
            local package="$1"
            local metadata_file="/tmp/${package}-preflight.json"
            local status

            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$metadata_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GHCR_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${package}")"

            case "$status" in
              200)
                metadata_is_private_expected_repository "$package" <"$metadata_file" || {
                  echo "Existing GHCR package ${package} is not private or is linked to an unexpected repository" >&2
                  exit 1
                }
                ;;
              *)
                echo "Unable to preflight GHCR package ${package}: HTTP ${status}" >&2
                exit 1
                ;;
            esac
          }

          preflight_package "$server_package"
          preflight_package "$client_package"

          python3 -B tools/wa_controlled_release.py build \
            --context-directory "$RUNNER_TEMP/wa-controlled-context" \
            --revision "$RELEASE_SHA" \
            --expected-source-sha256 "$CONTROLLED_SOURCE_SHA256" \
            --expected-manifest-sha256 "$CONTROLLED_MANIFEST_SHA256" \
            --evidence-directory "$RUNNER_TEMP/wa-release-evidence" \
            --push

          server_digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/wa-release-evidence/server-buildx.json")"
          client_digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/wa-release-evidence/client-buildx.json")"

          verify_private_expected_repository() {
            local package="$1"
            local metadata

            metadata="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GHCR_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${package}")"

            metadata_is_private_expected_repository "$package" <<<"$metadata" || {
              echo "GHCR package ${package} is not private or is linked to an unexpected repository; refusing release" >&2
              exit 1
            }
          }

          verify_private_expected_repository "$server_package"
          verify_private_expected_repository "$client_package"

          server_ref="${image_root}/${server_package}@${server_digest}"
          client_ref="${image_root}/${client_package}@${client_digest}"

          server_revision="$(docker buildx imagetools inspect "$server_ref" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          client_revision="$(docker buildx imagetools inspect "$client_ref" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$server_revision" == "$RELEASE_SHA" ]] \
            || { echo "Server OCI revision does not match the verified commit" >&2; exit 1; }
          [[ "$client_revision" == "$RELEASE_SHA" ]] \
            || { echo "Client OCI revision does not match the verified commit" >&2; exit 1; }

          for image in "$server_ref" "$client_ref"; do
            source_marker="$(docker buildx imagetools inspect "$image" \
              --format '{{ index .Image.Config.Labels "savana.candidate.source-sha256" }}')"
            [[ "$source_marker" == "$CONTROLLED_SOURCE_SHA256" ]] \
              || { echo "Image public source marker differs from verified controlled content" >&2; exit 1; }
          done

          anonymous_config="$(mktemp -d)"
          for image in "$server_ref" "$client_ref"; do
            anonymous_error=""
            if anonymous_error="$(DOCKER_CONFIG="$anonymous_config" \
              docker manifest inspect "$image" 2>&1)"; then
              echo "Private GHCR image is anonymously readable: $image" >&2
              exit 1
            fi
            if ! grep -Eqi 'denied|unauthorized|authentication required' <<<"$anonymous_error"; then
              echo "Anonymous access failed for an unverified reason: $image" >&2
              exit 1
            fi
          done

          {
            printf '## Wa Savana immutable images\n\n'
            printf '| Component | Pull reference |\n'
            printf '| --- | --- |\n'
            printf '| Server | `%s` |\n' "$server_ref"
            printf '| Client | `%s` |\n' "$client_ref"
            printf '\nVerified Git revision: `%s`\n\n' "$RELEASE_SHA"
            printf 'Public runtime setting: `WA_BROWSER_RELEASE=%s`\n\n' "$CONTROLLED_SOURCE_SHA256"
            printf 'Controlled recipe/context evidence:\n\n```json\n'
            cat "$RUNNER_TEMP/wa-release-evidence/release-evidence.json"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
